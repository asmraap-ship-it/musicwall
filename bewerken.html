<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nummer bewerken</title>
  <link rel="stylesheet" href="css/toevoegen.css">
  <script>
  const thema = localStorage.getItem('musicwall-thema')
  if (thema) document.documentElement.setAttribute('data-thema', thema)
  require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
    if (t) document.documentElement.setAttribute('data-thema', t)
    else document.documentElement.removeAttribute('data-thema')
  })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <link rel="stylesheet" href="css/themas/chroom.css">
  <link rel="stylesheet" href="css/themas/oceaan.css">
  <link rel="stylesheet" href="css/themas/radar.css">

</head>
<body>

<div class="titelbalk-drag"></div>

<h2 data-i18n="bewerken.titel">Nummer bewerken</h2>

<div class="veld">
  <label data-i18n="toevoegen.artiestLabel">Artiest</label>
  <input type="text" id="artiest" data-i18n-placeholder="toevoegen.artiestPlaceholder" placeholder="Naam van de artiest">
</div>

<div class="veld">
  <label data-i18n="toevoegen.titelLabel">Titel</label>
  <input type="text" id="titel" data-i18n-placeholder="toevoegen.titelPlaceholder" placeholder="Naam van het nummer">
</div>

<div class="veld">
  <label data-i18n="toevoegen.verhaalLabel">Verhaal</label>
  <textarea id="verhaal" data-i18n-placeholder="toevoegen.verhaalPlaceholder" placeholder="Waarom betekent dit nummer iets voor u?"></textarea>
</div>

<div class="veld">
  <label data-i18n="toevoegen.tagLabel">Tag</label>
  <input type="text" id="tag" data-i18n-placeholder="toevoegen.tagPlaceholder" placeholder="bijv. Live · Concert of Omwenteling">
</div>

<button class="opslaan-btn" onclick="slaOp()" data-i18n="algemeen.opslaanBtn">Opslaan</button>
<div class="melding" id="melding"></div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/bewerken.js"></script>
</body>
</html>
