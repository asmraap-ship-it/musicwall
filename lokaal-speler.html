<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Musicwall</title>
  <link rel="stylesheet" href="css/lokaal-speler.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
    require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
      if (t) document.documentElement.setAttribute('data-thema', t)
      else document.documentElement.removeAttribute('data-thema')
    })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
</head>
<body id="speler-body">
  <img id="cover-img" style="display:none">
  <div id="placeholder" class="placeholder" style="display:none">&#9835;</div>
  <div id="track-info" style="display:none">
    <div id="track-artiest"></div>
    <div id="track-titel"></div>
  </div>
  <audio id="audio-el" style="display:none" autoplay controls></audio>
  <video id="video-el" style="display:none" autoplay controls></video>

  <script src="js/lokaal-speler.js"></script>
</body>
</html>
