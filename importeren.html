<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Videos importeren</title>
  <link rel="stylesheet" href="css/toevoegen.css">
  <script>
  const thema = localStorage.getItem('musicwall-thema')
  if (thema) document.documentElement.setAttribute('data-thema', thema)
  require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
    if (t) document.documentElement.setAttribute('data-thema', t)
    else document.documentElement.removeAttribute('data-thema')
  })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <link rel="stylesheet" href="css/themas/chroom.css">
  <link rel="stylesheet" href="css/themas/oceaan.css">
  <link rel="stylesheet" href="css/themas/radar.css">

  <style>
    .voortgang {
      margin-top: 1rem;
      font-size: 12px;
      color: var(--tekst-dim);
      letter-spacing: 0.05em;
    }

    .voortgang-balk {
      width: 100%;
      height: 2px;
      background: var(--rand-2);
      border-radius: 1px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .voortgang-vulling {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      width: 0%;
      transition: width 0.2s;
    }

    .bestand-lijst {
      margin-top: 1rem;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--rand-2);
      border-radius: 3px;
      padding: 0.5rem;
    }

    #bestand-filter {
      margin-bottom: 0.75rem;
    }

    .bestand-lijst-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .bestand-selecteer-alles-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.65rem;
      background: transparent;
      border: 1px solid var(--rand-2);
      border-radius: 3px;
      color: var(--tekst-donker);
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .bestand-selecteer-alles-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bestand-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 12px;
      color: var(--tekst-dim);
      padding: 0.25rem 0;
      border-bottom: 1px solid var(--rand);
      border-left: 2px solid transparent;
      cursor: pointer;
    }

    .bestand-nummer {
      font-size: 10px;
      color: var(--accent);
      opacity: 0.5;
      min-width: 18px;
      flex-shrink: 0;
    }

    .bestand-naam {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bestand-item.geselecteerd {
      border-left-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--tekst);
    }

    .bestand-item.klaar { color: var(--accent); }
    .bestand-item.actief { color: var(--tekst); }
  </style>
</head>
<body>

<div class="titelbalk-drag"></div>

<h2 data-i18n="importeren.titel">Videos importeren</h2>

<div class="veld">
  <label data-i18n="wallGroep.selectLabel">Groep</label>
  <select id="groep-keuze"></select>
</div>

<div class="veld">
  <label data-i18n="importeren.wallLabel">Wall</label>
  <select id="wall-keuze"></select>
</div>

<div id="bestand-lijst-container" style="display:none">
  <div class="veld">
    <input type="text" id="bestand-filter" oninput="filterBestanden()" data-i18n-placeholder="importeren.filterPlaceholder" placeholder="Filter op bestandsnaam…">
    <div class="bestand-lijst-header">
      <label id="bestand-label">0 videobestanden gevonden</label>
      <button type="button" class="bestand-selecteer-alles-btn" id="bestand-selecteer-alles-btn" onclick="toggleSelecteerAlleBestanden()" data-i18n="importeren.selecteerAlles">☑ Selecteer alles</button>
    </div>
    <div class="bestand-lijst" id="bestand-lijst"></div>
  </div>

  <div class="voortgang" id="voortgang-tekst"></div>
  <div class="voortgang-balk">
    <div class="voortgang-vulling" id="voortgang-vulling"></div>
  </div>
</div>

<button class="opslaan-btn" id="import-btn" onclick="startImport()" style="margin-top:1.5rem" data-i18n="importeren.kiesMapBtn">Kies map</button>
<div class="melding" id="melding"></div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/importeren.js"></script>
</body>
</html>
