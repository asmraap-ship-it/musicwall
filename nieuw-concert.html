<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nieuw concert</title>
  <link rel="stylesheet" href="css/toevoegen.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
    require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
      if (t) document.documentElement.setAttribute('data-thema', t)
      else document.documentElement.removeAttribute('data-thema')
    })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <link rel="stylesheet" href="css/themas/chroom.css">
  <link rel="stylesheet" href="css/themas/oceaan.css">
  <link rel="stylesheet" href="css/themas/radar.css">
</head>
<body>

<div class="titelbalk-drag"></div>

<h2 id="titel">Nieuw concert</h2>

<div class="veld">
  <label data-i18n="nieuwConcert.naamLabel">Naam van het concert</label>
  <input type="text" id="naam" data-i18n-placeholder="nieuwConcert.naamPlaceholder" placeholder="bijv. Elements of Life Tour" autofocus>
</div>

<div class="veld">
  <label data-i18n="nieuwConcert.artiestLabel">Artiest</label>
  <input type="text" id="artiest" data-i18n-placeholder="nieuwConcert.artiestPlaceholder" placeholder="bijv. Tiësto">
</div>

<div class="veld">
  <label data-i18n="nieuwConcert.datumLabel">Datum</label>
  <input type="text" id="datum" data-i18n-placeholder="nieuwConcert.datumPlaceholder" placeholder="bijv. 14 maart 2018">
</div>

<div class="veld">
  <label data-i18n="nieuwConcert.verhaalLabel">Verhaal</label>
  <textarea id="verhaal" rows="4" data-i18n-placeholder="nieuwConcert.verhaalPlaceholder" placeholder="Wat maakte deze avond bijzonder?"></textarea>
</div>

<button class="opslaan-btn" id="opslaan-btn" onclick="slaOp()">Concert aanmaken</button>
<div class="melding" id="melding"></div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nieuw-concert.js"></script>
</body>
</html>
