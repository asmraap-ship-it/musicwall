<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nieuw concert</title>
  <link rel="stylesheet" href="css/toevoegen.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
</head>
<body>

<div class="titelbalk-drag"></div>

<h2 id="titel">Nieuw concert</h2>

<div class="veld">
  <label>Naam van het concert</label>
  <input type="text" id="naam" placeholder="bijv. Elements of Life Tour" autofocus>
</div>

<div class="veld">
  <label>Artiest</label>
  <input type="text" id="artiest" placeholder="bijv. Tiësto">
</div>

<div class="veld">
  <label>Datum</label>
  <input type="text" id="datum" placeholder="bijv. 14 maart 2018">
</div>

<div class="veld">
  <label>Verhaal</label>
  <textarea id="verhaal" rows="4" placeholder="Wat maakte deze avond bijzonder?"></textarea>
</div>

<button class="opslaan-btn" id="opslaan-btn" onclick="slaOp()">Concert aanmaken</button>
<div class="melding" id="melding"></div>

<script src="js/nieuw-concert.js"></script>
</body>
</html>
