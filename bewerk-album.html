<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Album bewerken</title>
  <link rel="stylesheet" href="css/toevoegen.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
    require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
      if (t) document.documentElement.setAttribute('data-thema', t)
      else document.documentElement.removeAttribute('data-thema')
    })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
</head>
<body>

<div class="titelbalk-drag"></div>

<h2 data-i18n="albumBewerken.titel">Album bewerken</h2>

<div class="veld">
  <label data-i18n="albumImport.naamLabel">Albumnaam</label>
  <input type="text" id="album-naam" autofocus>
</div>

<div class="veld">
  <label data-i18n="albumImport.artiestLabel">Artiest</label>
  <input type="text" id="album-artiest">
</div>

<div class="veld">
  <label data-i18n="albumImport.genreLabel">Genre</label>
  <input type="text" id="album-genre" list="genre-lijst">
  <datalist id="genre-lijst"></datalist>
</div>

<button class="opslaan-btn" onclick="slaOp()" data-i18n="algemeen.opslaanBtn">Opslaan</button>
<div class="melding" id="melding"></div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/bewerk-album.js"></script>
</body>
</html>
