name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        # Geen Electron-target-vars meer nodig: better-sqlite3 v13+ is N-API-based,
        # dus de kale-Node-prebuilt die npm ci hier ophaalt is ABI-compatibel met
        # Electron's Node-runtime. De oude target-vars (runtime/target/disturl)
        # matchten niet meer met v13's prebuild-lookup en dwongen juist een
        # node-gyp source-compile af, wat faalde: deze CI-runner heeft geen
        # Visual Studio. electron-builder's eigen rebuild-stap is uitgeschakeld
        # via package.json's build.npmRebuild=false, om dezelfde reden overbodig.
        run: npm ci

      - name: Build and publish
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
