name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        # `npm ci` bouwt zijn install-scripts-plan op basis van package-lock.json,
        # dat custom package.json-velden zoals better-sqlite3's `gypfile: false`
        # niet meebewaart — daardoor denkt npm alsnog dat er een `node-gyp rebuild`
        # nodig is (binding.gyp staat gewoon op disk), wat faalt zonder bruikbare
        # Visual Studio-detectie, terwijl better-sqlite3 v13 (N-API) al een
        # kant-en-klare win32-x64-prebuild meelevert die dat helemaal niet nodig
        # heeft. Opgelost door install-scripts helemaal over te slaan en daarna
        # gericht alleen de twee packages te herbouwen die een écht install-script
        # nodig hebben (ffmpeg-static downloadt ffmpeg.exe, electron-winstaller
        # kiest zijn 7z-architectuur) — better-sqlite3 blijft zo buiten schot.
        run: |
          npm ci --ignore-scripts
          npm rebuild ffmpeg-static electron-winstaller

      - name: Build and publish
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
