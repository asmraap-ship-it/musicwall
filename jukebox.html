<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Musicwall Jukebox</title>
  <link rel="stylesheet" href="css/jukebox.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
    require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
      if (t) document.documentElement.setAttribute('data-thema', t)
      else document.documentElement.removeAttribute('data-thema')
    })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <script>window.gsap = require('gsap').gsap</script>

</head>
<body>

<div class="jukebox">
  <div class="playlist-kolom">
    <div class="playlist-header">
      <span data-i18n="jukebox.playlist">Playlist</span>
      <div class="playlist-header-acties">
        <button class="playlist-header-icoon-btn" onclick="openOpslaanPlaylist()" data-i18n-title="jukebox.playlistOpslaanTooltip" title="Playlist opslaan">💾</button>
        <button class="playlist-header-icoon-btn" onclick="toonOpgeslagenPlaylists()" data-i18n-title="jukebox.opgeslagenPlaylistsTooltip" title="Opgeslagen playlists">📂</button>
        <button class="playlist-header-icoon-btn" onclick="toonMeestGespeeld()" data-i18n-title="jukebox.meestGespeeldTooltip" title="Meest gespeeld">📊</button>
        <button class="leeg-btn" onclick="leegMaken()" data-i18n="jukebox.leegmaken">Leegmaken</button>
      </div>
    </div>
    <div class="bibliotheek-zoek-balk">
      <input type="text" id="bibliotheek-zoekveld" oninput="zoekBibliotheekLive()" data-i18n-placeholder="jukebox.bibliotheekZoeken" placeholder="Zoek in je bibliotheek...">
    </div>
    <div class="playlist-lijst" id="playlist-lijst"></div>
    <div class="bibliotheek-resultaten" id="bibliotheek-resultaten" style="display:none"></div>
    <div class="opgeslagen-playlists" id="opgeslagen-playlists" style="display:none">
      <button class="terug-btn" onclick="sluitOpgeslagenPlaylists()">&#8592; <span data-i18n="jukebox.terugNaarPlaylist">Terug naar playlist</span></button>
      <div class="opgeslagen-playlists-lijst" id="opgeslagen-playlists-lijst"></div>
    </div>
    <div class="opgeslagen-playlists" id="meest-gespeeld" style="display:none">
      <button class="terug-btn" onclick="sluitMeestGespeeld()">&#8592; <span data-i18n="jukebox.terugNaarPlaylist">Terug naar playlist</span></button>
      <div class="opgeslagen-playlists-lijst" id="meest-gespeeld-lijst"></div>
    </div>
  </div>
  <div class="selectie-info" id="bibliotheek-selectie-info">
    <span id="bibliotheek-selectie-tekst"></span>
    <button class="naar-jukebox-btn" onclick="voegBibliotheekSelectieToe()" data-i18n="selectie.voegToeAanPlaylist">&#9835; Voeg toe aan de playlist</button>
  </div>

  <div class="speel-kolom">
	<div class="speel-scherm" id="speel-scherm">
	  <video id="speler" controls></video>
	  <div class="youtube-speler-wrap" id="youtube-speler-wrap">
	    <iframe id="youtube-speler-frame" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media"></iframe>
	  </div>
	  <div class="audio-cover-wrap" id="audio-cover-wrap">
	    <div class="audio-cover-content" id="audio-cover-content">
	      <div class="turntable-anchor">
	        <div id="turntable-svg-wrap"></div>
	      </div>
	      <div class="audio-track-info" id="audio-track-info"></div>
	    </div>
	    <div class="audio-progress-rij">
	      <span class="audio-tijd" id="audio-tijd-huidig">0:00</span>
	      <div class="audio-progress-balk" id="audio-progress-balk" onclick="zoekInAudio(event)">
	        <div class="audio-progress-vulling" id="audio-progress-vulling"></div>
	      </div>
	      <span class="audio-tijd" id="audio-tijd-duur">0:00</span>
	    </div>
	  </div>
	  <div class="speel-placeholder" id="speel-placeholder">
		<div class="speel-icoon">♪</div>
		<div class="speel-tekst" data-i18n="jukebox.kiesNummer">Kies een nummer uit de playlist</div>
	  </div>
	  <div class="foutmelding" id="foutmelding"></div>
	  <button class="fullscreen-btn" id="fullscreen-btn" onclick="schermvullend()" data-i18n-title="jukebox.schermvullend" title="Schermvullend">⛶</button>
	</div>
	<div class="spectrum-analyzer" id="spectrum-analyzer"></div>
	<div class="navigatie">
	  <div class="navigatie-knoppen">
	     <button onclick="schudPlaylist()" id="shuffle-btn" data-i18n-title="jukebox.shuffle" title="Shuffle">⤮</button>
	     <button onclick="naarEerste()" data-i18n-title="jukebox.eerste" title="Eerste">⏮</button>
   	     <button onclick="vorige()" data-i18n-title="jukebox.vorige" title="Vorige">◀</button>
		 <button onclick="speelPauze()" id="play-btn" data-i18n-title="jukebox.afspelen" title="Afspelen">▶</button>
		 <button onclick="stop(true)" data-i18n-title="jukebox.stoppen" title="Stoppen">⏹</button>
		 <button onclick="volgende()" data-i18n-title="jukebox.volgende" title="Volgende">▶</button>
		 <button onclick="naarLaatste()" data-i18n-title="jukebox.laatste" title="Laatste">⏭</button>
		 <button onclick="toggleSpectrumZichtbaar()" id="spectrum-toggle-btn" data-i18n-title="jukebox.spectrumTooltip" title="Equalizer tonen/verbergen">🎛</button>
		 <button onclick="toggleStroboZichtbaar()" id="strobo-toggle-btn" data-i18n-title="jukebox.stroboTooltip" title="Stroboscooplicht tonen/verbergen">💡</button>
	  </div>
		 <div class="platenspeler-schaal-rij" id="platenspeler-schaal-rij" data-i18n-title="jukebox.platenspelerSchaalTooltip" title="Platenspeler vergroten/verkleinen">
		   <span class="platenspeler-schaal-icoon">&#128269;</span>
		   <input type="range" id="platenspeler-schaal-slider" min="50" max="150" step="5" value="100" oninput="stelPlatenspelerSchaalIn(this.value)">
		 </div>
	</div>
  </div>
</div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/turntable.js"></script>
<script src="js/jukebox.js"></script>
</body>
</html>
