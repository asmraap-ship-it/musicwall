<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bronbestand voor import in de Rive-editor (rive.app) - dit SVG-bestand is GEEN onderdeel van de
  draaiende Musicwall-app zelf, alleen een startpunt voor het handmatig riggen van de platenspeler-animatie
  in Rive. Proporties (draaipunt, plaatstraal, labelstraal) zijn gebaseerd op pixelmetingen op een echte
  Pioneer PLX-1000-referentiefoto, dezelfde verhoudingen als de eerdere CSS/SVG-poging in jukebox.html/
  css/jukebox.css/js/tonearm.js (zie CLAUDE.md ## Jukebox-gedrag) - alleen x10 opgeschaald voor een
  scherper canvas (1280x1000, viewBox-eenheden matchen 1-op-1 met px).

  Rig-stappen die je zelf in de Rive-editor moet doen (kan niet vanuit hier geautomatiseerd worden):
  1. Importeer dit bestand (File > Import SVG in Rive).
  2. Maak van group id="platter" een los artboard-onderdeel met een simpele rotatie-animatie (0-360°,
     lineair, loop) voor het ronddraaien van de plaat zelf.
  3. Voeg op group id="tonearm" één bone toe met het draaipunt op (1080, 200) - exact het middelpunt van
     group id="pivot-basis". Parent de hele tonearm-tekening (arm, headshell, tegengewicht) aan die bone.
  4. Maak een State Machine met:
     - een Number-input "voortgang" (0 = rust/buitenrand, 1 = einde/binnenste groeven) die de bone-rotatie
       aanstuurt van -20° naar 0° (dezelfde hoeken als de afgekeurde CSS/SVG-versie, nu wel veilig: bij
       -20° blijft de headshell-rand ruim binnen de plaatrand, bij 0° blijft de naald ruim buiten het label)
     - een Boolean-input "speelt" die de platter-rotatie-animatie (stap 2) aan/uit zet
  5. Exporteer als .riv, zet het bestand ergens in het Musicwall-project (bv. een nieuwe map
     `rive-assets/platenspeler.riv`) en laat het inladen via de @rive-app/canvas-runtime op een <canvas>
     i.p.v. het huidige .platenspeler/.vinyl-plaat/.tonearm-drietal in jukebox.html.
-->
<svg width="1280" height="1000" viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="55%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <radialGradient id="plaat-grad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
  </defs>

  <!-- Chassis-achtergrond -->
  <rect x="0" y="0" width="1280" height="1000" rx="40" fill="url(#chassis-grad)"/>

  <!-- Plaat: los groepje, in Rive los te riggen met een doorlopende rotatie-animatie rond (500,500) -->
  <g id="platter">
    <circle id="plaat-body" cx="500" cy="500" r="500" fill="url(#plaat-grad)"/>
    <circle cx="500" cy="500" r="455" fill="none" stroke="#e0e4e9" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="4 10"/>
    <circle cx="500" cy="500" r="425" fill="none" stroke="#e0e4e9" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="3 8"/>
    <!-- groef-textuur, 12 dunne concentrische cirkels tussen label en binnenste strobe-ring -->
    <g stroke="#000000" stroke-opacity="0.35" fill="none" stroke-width="1.5">
      <circle cx="500" cy="500" r="235"/>
      <circle cx="500" cy="500" r="252"/>
      <circle cx="500" cy="500" r="269"/>
      <circle cx="500" cy="500" r="286"/>
      <circle cx="500" cy="500" r="303"/>
      <circle cx="500" cy="500" r="320"/>
      <circle cx="500" cy="500" r="337"/>
      <circle cx="500" cy="500" r="354"/>
      <circle cx="500" cy="500" r="371"/>
      <circle cx="500" cy="500" r="388"/>
      <circle cx="500" cy="500" r="405"/>
    </g>
    <!-- label (de albumhoes komt hier in Musicwall zelf overheen, hier als vlakke placeholder) -->
    <circle id="label" cx="500" cy="500" r="210" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
    <circle cx="500" cy="500" r="10" fill="#0d0d0d"/>
  </g>

  <!-- Tonearm: los te riggen met één bone, draaipunt = middelpunt van pivot-basis (1080,200) -->
  <g id="tonearm">
    <line x1="1080" y1="200" x2="1111.5" y2="161.2" stroke="#232326" stroke-width="55" stroke-linecap="round"/>
    <path d="M 1080,200 Q 980.8,401.5 735,625" fill="none" stroke="#d4d8dc" stroke-width="17" stroke-linecap="round"/>
    <rect x="665.4" y="631.9" width="80" height="40" rx="11" fill="#38383c" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" transform="rotate(137.72 705.4 651.9)"/>
    <circle cx="675.8" cy="678.8" r="12" fill="#c8a87a"/>
  </g>

  <!-- Pivot-behuizing: blijft vast (draait niet mee met de tonearm-bone) -->
  <g id="pivot-basis">
    <circle cx="1080" cy="200" r="60" fill="#0f0f10" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
    <circle cx="1080" cy="200" r="35" fill="#232326" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5"/>
  </g>
</svg>
