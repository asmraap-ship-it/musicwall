<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Concert</title>
  <link rel="stylesheet" href="css/concert-detail.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
    require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
      if (t) document.documentElement.setAttribute('data-thema', t)
      else document.documentElement.removeAttribute('data-thema')
    })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <link rel="stylesheet" href="css/themas/chroom.css">
  <link rel="stylesheet" href="css/themas/oceaan.css">
  <link rel="stylesheet" href="css/themas/radar.css">
  <script>window.gsap = require('gsap').gsap</script>
</head>
<body>

<div class="titelbalk-drag"></div>

<div class="selectie-info" id="selectie-info">
  <span id="selectie-tekst"></span>
  <button class="naar-jukebox-btn" id="naar-jukebox-btn" onclick="stuurNaarJukebox()" data-i18n="selectie.voegToeAanPlaylist">&#9835; Voeg toe aan de playlist</button>
  <button class="verwijder-selectie-btn" id="verwijder-selectie-btn" onclick="verwijderSelectie()" data-i18n="selectie.verwijderen">Verwijderen</button>
</div>

<div class="concert-header">
  <div class="concert-header-artiest" id="detail-artiest"></div>
  <h1 class="concert-header-naam" id="detail-naam"></h1>
  <div class="concert-header-datum" id="detail-datum"></div>
</div>

<div class="concert-verhaal" id="detail-verhaal"></div>

<div class="media-toevoegen-balk">
  <button class="bestand-btn" onclick="kiesMedia()" data-i18n="concertDetail.fotoVideoToevoegen">📁 Foto / video toevoegen</button>
  <div class="youtube-toevoegen">
    <input type="url" id="youtube-url-input" placeholder="https://www.youtube.com/watch?v=...">
    <button class="bestand-btn" onclick="voegYoutubeToe()" data-i18n="concertDetail.youtubeToevoegen">▶ YouTube toevoegen</button>
  </div>
  <button class="bestand-btn" id="selecteer-alles-btn" onclick="toggleSelecteerAlleInConcert()" data-i18n="concertDetail.selecteerAllesBtn" style="display:none">☑ Selecteer alles</button>
</div>

<div class="concert-media-grid" id="media-grid"></div>

<div class="lightbox" id="lightbox" onclick="sluitLightbox()">
  <button class="lightbox-nav lightbox-vorige" id="viewer-vorige" onclick="viewerVorige(event)">&#10094;</button>
  <div class="lightbox-inhoud" id="lightbox-inhoud" onclick="event.stopPropagation()"></div>
  <button class="lightbox-nav lightbox-volgende" id="viewer-volgende" onclick="viewerVolgende(event)">&#10095;</button>
</div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/link-controle.js"></script>
<script src="js/concert-detail.js"></script>
</body>
</html>
