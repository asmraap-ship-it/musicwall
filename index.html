<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Musicwall</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <script>window.gsap = require('gsap').gsap</script>
</head>
<body>
<script>
  window.Flip = require('gsap/Flip').Flip
  gsap.registerPlugin(Flip)
</script>
<canvas id="achtergrond"></canvas>
<div class="selectie-info" id="selectie-info">
  <span id="selectie-tekst"></span>
  <button class="naar-jukebox-btn" id="naar-jukebox-btn" onclick="stuurNaarJukebox()" data-i18n="selectie.voegToeAanPlaylist">&#9835; Voeg toe aan de playlist</button>
  <button class="verwijder-selectie-btn" id="verwijder-selectie-btn" onclick="verwijderSelectie()" data-i18n="selectie.verwijderen">Verwijderen</button>
</div>
<header>
  <div class="header-links">
    <h1><span>Musicwall</span> <span class="h1-icoon">&#9835;</span></h1>
    <input type="text" class="globaal-zoekveld" id="globaal-zoekveld" oninput="zoekLive()" data-i18n-placeholder="header.globaalZoeken" placeholder="Zoek op artiest of titel…">
  </div>
  <div class="header-knoppen">
    <button class="toevoegen-btn" onclick="openImporteren()" data-i18n="header.mapImporteren">&#8593; Map importeren</button>
    <button class="toevoegen-btn" onclick="openZoeken()" data-i18n="header.youtubeZoeken">&#8981; YouTube zoeken</button>
    <button class="toevoegen-btn" onclick="openJukebox()" data-i18n="header.jukebox">&#9835; Jukebox</button>
    <button class="toevoegen-btn" onclick="openHelp()" data-i18n="header.help">? Help</button>
    <div id="prullenbak" ondragover="prullenbakOver(event)" ondragleave="prullenbakLeave(event)" ondrop="prullenbakDrop(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="3,6 5,6 21,6"/>
        <path d="M19,6l-1,14H6L5,6"/>
        <path d="M10,11v6M14,11v6"/>
        <path d="M9,6V4h6v2"/>
      </svg>
      <span class="prullenbak-label" data-i18n="header.prullenbakLabel">Sleep hierheen om te verwijderen</span>
    </div>
  </div>
  <div class="header-rechts">
    <div class="thema-dropdown" id="taal-dropdown">
      <button class="thema-knop" onclick="toggleTaalMenu(event)" data-i18n-title="header.taalKiezen" title="Kies een taal">
        <span id="taal-label">NL</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
    </div>
    <div class="thema-dropdown" id="thema-dropdown">
      <button class="thema-knop" onclick="toggleThemaMenu(event)" data-i18n-title="header.themaKiezen" title="Kies een thema">
        <span id="thema-label" data-i18n="thema.standaard">Standaard</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="sectie-tabs" id="sectie-tabs">
  <button class="tab-btn" id="btn-concerten" data-i18n-title="wallGroep.hernoemenTooltip" title="Dubbelklik om te hernoemen">
    <span class="tab-label" data-i18n="tabs.concerten">Mijn concerten</span>
  </button>
  <button class="tab-btn actief" id="btn-walls" data-i18n-title="wallGroep.hernoemenTooltip" title="Dubbelklik om te hernoemen">
    <span class="tab-label" data-i18n="tabs.walls">Mijn walls</span>
  </button>
  <button class="tab-btn tab-nieuw" id="btn-nieuwe-groep" onclick="voegWallGroepToe()" data-i18n-title="wallGroep.nieuweGroepTooltip" title="Nieuwe groep">+</button>
</div>
<div class="thema-menu" id="thema-menu">
  <div class="thema-optie" onclick="kiesThema('')" data-i18n="thema.standaard">Standaard</div>
  <div class="thema-optie" onclick="kiesThema('metaal')" data-i18n="thema.metaal">Metaal</div>
  <div class="thema-optie" onclick="kiesThema('jukebox')" data-i18n="thema.jukebox">Jukebox</div>
  <div class="thema-optie" onclick="kiesThema('nacht')" data-i18n="thema.nacht">Nacht</div>
  <div class="thema-optie" onclick="kiesThema('jr')" data-i18n="thema.raw">Raw</div>
  <div class="thema-optie" onclick="kiesThema('natuur')" data-i18n="thema.natuur">Natuur</div>
  <div class="thema-optie" onclick="kiesThema('licht')" data-i18n="thema.licht">Licht</div>
</div>
<div class="thema-menu" id="taal-menu">
  <div class="thema-optie" onclick="kiesTaal('nl')">Nederlands</div>
  <div class="thema-optie" onclick="kiesTaal('en')">English</div>
</div>
<div class="walls-container" id="walls-container"></div>
<div class="concerten-container" id="concerten-container" style="display:none"></div>
<div class="zoek-resultaten-container" id="globale-zoek-resultaten" style="display:none"></div>
<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/achtergrond.js"></script>
<script src="js/index.js"></script>
<script src="js/concerten.js"></script>
</body>
</html>
