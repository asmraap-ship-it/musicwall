<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Album</title>
  <link rel="stylesheet" href="css/concert-detail.css">
  <link rel="stylesheet" href="css/album-detail.css">
  <script>
    const thema = localStorage.getItem('musicwall-thema')
    if (thema) document.documentElement.setAttribute('data-thema', thema)
    require('electron').ipcRenderer.on('thema-toegepast', (event, t) => {
      if (t) document.documentElement.setAttribute('data-thema', t)
      else document.documentElement.removeAttribute('data-thema')
    })
  </script>
  <link rel="stylesheet" href="css/themas/metaal.css">
  <link rel="stylesheet" href="css/themas/jukebox.css">
  <link rel="stylesheet" href="css/themas/nacht.css">
  <link rel="stylesheet" href="css/themas/jr.css">
  <link rel="stylesheet" href="css/themas/natuur.css">
  <link rel="stylesheet" href="css/themas/licht.css">
  <script>window.gsap = require('gsap').gsap</script>
</head>
<body>

<div class="titelbalk-drag"></div>

<div class="selectie-info" id="selectie-info">
  <span id="selectie-tekst"></span>
  <button class="naar-jukebox-btn" onclick="stuurNaarJukebox()" data-i18n="selectie.voegToeAanPlaylist">&#9835; Voeg toe aan de playlist</button>
  <button class="verwijder-selectie-btn" onclick="verwijderSelectie()" data-i18n="selectie.verwijderen">Verwijderen</button>
</div>

<div class="album-header">
  <button class="album-nav-pijl" id="album-vorig-album-btn" onclick="vorigAlbum()" data-i18n-title="albumDetail.vorigAlbumTooltip" title="Vorig album">&#10094;</button>
  <div class="album-cover-groot" id="album-cover"></div>
  <div class="album-header-info">
    <div class="concert-header-artiest" id="detail-artiest"></div>
    <h1 class="concert-header-naam" id="detail-naam"></h1>
    <div class="album-track-aantal" id="detail-aantal"></div>
    <button class="bestand-btn" onclick="bewerkHuidigAlbum()" data-i18n="albumDetail.bewerkenBtn">✎ Album bewerken</button>
  </div>
  <button class="album-nav-pijl" id="album-volgend-album-btn" onclick="volgendAlbum()" data-i18n-title="albumDetail.volgendAlbumTooltip" title="Volgend album">&#10095;</button>
</div>

<div class="album-draaitafel-wrap" id="album-draaitafel-wrap">
  <div id="turntable-svg-wrap"></div>
  <div class="album-draaitafel-track-info" id="album-draaitafel-track-info"></div>
</div>

<div class="track-acties-balk">
  <button class="bestand-btn" id="selecteer-alles-btn" onclick="toggleSelecteerAlleInAlbum()" data-i18n="concertDetail.selecteerAllesBtn" style="display:none">☑ Selecteer alles</button>
</div>

<div class="track-lijst" id="track-lijst"></div>

<audio id="album-speler" style="display:none"></audio>

<div class="album-navigatie">
  <div class="album-progress-rij">
    <span class="album-tijd" id="album-tijd-huidig">0:00</span>
    <div class="album-progress-balk" id="album-progress-balk" onclick="zoekInAlbumSpeler(event)">
      <div class="album-progress-vulling" id="album-progress-vulling"></div>
    </div>
    <span class="album-tijd" id="album-tijd-duur">0:00</span>
  </div>
  <div class="album-navigatie-knoppen">
    <button onclick="albumEerste()" data-i18n-title="jukebox.eerste" title="Eerste">&#9198;</button>
    <button onclick="albumVorige()" data-i18n-title="jukebox.vorige" title="Vorige">&#9664;</button>
    <button onclick="albumSpeelPauze()" id="album-play-btn" data-i18n-title="jukebox.afspelen" title="Afspelen">&#9654;</button>
    <button onclick="albumStop()" data-i18n-title="jukebox.stoppen" title="Stoppen">&#9209;</button>
    <button onclick="albumVolgende()" data-i18n-title="jukebox.volgende" title="Volgende">&#9654;</button>
    <button onclick="albumLaatste()" data-i18n-title="jukebox.laatste" title="Laatste">&#9197;</button>
    <span class="album-navigatie-track" id="album-navigatie-track"></span>
    <button onclick="toggleDraaitafelZichtbaar()" id="draaitafel-toggle-btn" data-i18n-title="albumDetail.draaitafelTooltip" title="Draaitafel tonen/verbergen">&#128191;</button>
  </div>
</div>

<script src="js/vertalingen.js"></script>
<script src="js/i18n.js"></script>
<script src="js/turntable.js"></script>
<script src="js/album-detail.js"></script>
</body>
</html>
